services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infographic
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/infographic?sslmode=disable
      JWT_SECRET: development-secret-at-least-thirty-two-chars
      EDITOR_ORIGINS: http://localhost:3000
      AUTO_MIGRATE: "true"
      APP_ENV: development
    ports: ["8080:8080"]

volumes:
  pgdata:
